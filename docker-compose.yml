services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-video-studio:local
    working_dir: /workspace
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    environment:
      AI_VIDEO_STUDIO_ARTIFACT_ROOT: "${AI_VIDEO_STUDIO_ARTIFACT_ROOT:-/workspace/out}"
      HOME: /tmp/hermes-home
      NEXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_CACHE: /tmp/npm-cache
      NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-}"
      TTS_PROVIDER: "${TTS_PROVIDER:-f5-tts}"
      F5_TTS_BASE_URL: "${F5_TTS_BASE_URL:-}"
      F5_TTS_ENDPOINT: "${F5_TTS_ENDPOINT:-}"
      F5_TTS_VOICE_ID: "${F5_TTS_VOICE_ID:-default}"
      F5_TTS_FORMAT: "${F5_TTS_FORMAT:-wav}"
      F5_TTS_REFERENCE_AUDIO: "${F5_TTS_REFERENCE_AUDIO:-}"
    volumes:
      - .:/workspace
      - ai-video-studio-node-modules:/workspace/node_modules
      - ai-video-studio-next-cache:/workspace/.next
    ports:
      - "${APP_PORT:-3000}:3000"
    command: >-
      bash -lc "mkdir -p /tmp/hermes-home /tmp/npm-cache &&
      [ -d /workspace/node_modules/next ] || npm install &&
      npm run remotion:ensure-browser &&
      npm run dev -- --hostname 0.0.0.0 --port 3000"

  studio:
    image: ai-video-studio:local
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    environment:
      AI_VIDEO_STUDIO_ARTIFACT_ROOT: "${AI_VIDEO_STUDIO_ARTIFACT_ROOT:-/workspace/out}"
      HOME: /tmp/hermes-home
      NEXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_CACHE: /tmp/npm-cache
      NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
      CHOKIDAR_USEPOLLING: "1"
      WATCHPACK_POLLING: "true"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-}"
      TTS_PROVIDER: "${TTS_PROVIDER:-f5-tts}"
      F5_TTS_BASE_URL: "${F5_TTS_BASE_URL:-}"
      F5_TTS_ENDPOINT: "${F5_TTS_ENDPOINT:-}"
      F5_TTS_VOICE_ID: "${F5_TTS_VOICE_ID:-default}"
      F5_TTS_FORMAT: "${F5_TTS_FORMAT:-wav}"
      F5_TTS_REFERENCE_AUDIO: "${F5_TTS_REFERENCE_AUDIO:-}"
    volumes:
      - .:/workspace
      - ai-video-studio-node-modules:/workspace/node_modules
      - ai-video-studio-next-cache:/workspace/.next
    ports:
      - "${STUDIO_PORT:-3001}:3000"
    command: >-
      bash -lc "mkdir -p /tmp/hermes-home /tmp/npm-cache &&
      [ -d /workspace/node_modules/next ] || npm install &&
      npm run remotion:ensure-browser &&
      npm run remotion -- --host 0.0.0.0 --port 3000"

  render:
    image: ai-video-studio:local
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      HOME: /tmp/hermes-home
      NEXT_TELEMETRY_DISABLED: "1"
      NPM_CONFIG_CACHE: /tmp/npm-cache
      NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
      AI_VIDEO_STUDIO_ARTIFACT_ROOT: "${AI_VIDEO_STUDIO_ARTIFACT_ROOT:-/workspace/out}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-chat}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-}"
      TTS_PROVIDER: "${TTS_PROVIDER:-f5-tts}"
      F5_TTS_BASE_URL: "${F5_TTS_BASE_URL:-}"
      F5_TTS_ENDPOINT: "${F5_TTS_ENDPOINT:-}"
      F5_TTS_VOICE_ID: "${F5_TTS_VOICE_ID:-default}"
      F5_TTS_FORMAT: "${F5_TTS_FORMAT:-wav}"
      F5_TTS_REFERENCE_AUDIO: "${F5_TTS_REFERENCE_AUDIO:-}"
    volumes:
      - .:/workspace
      - ai-video-studio-node-modules:/workspace/node_modules
      - ai-video-studio-next-cache:/workspace/.next
      - ./out:/workspace/out
    command: >-
      bash -lc "mkdir -p /tmp/hermes-home /tmp/npm-cache /workspace/out &&
      [ -d /workspace/node_modules/next ] || npm install &&
      npm run remotion:ensure-browser &&
      mkdir -p \"${AI_VIDEO_STUDIO_ARTIFACT_ROOT:-/workspace/out}/renders\" &&
      npm run render -- --output \"${AI_VIDEO_STUDIO_ARTIFACT_ROOT:-/workspace/out}/renders/sample-render.mp4\""

volumes:
  ai-video-studio-node-modules:
  ai-video-studio-next-cache:
