services:
  producer:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-video-studio:local
    working_dir: /workspace
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    restart: unless-stopped
    environment:
      AI_VIDEO_STUDIO_ARTIFACT_ROOT: "${AI_VIDEO_STUDIO_ARTIFACT_ROOT:-/workspace/out}"
      HOME: /tmp/ai-video-studio-home
      NPM_CONFIG_CACHE: /tmp/npm-cache
      NPM_CONFIG_REGISTRY: "https://registry.npmmirror.com"
      CHOKIDAR_USEPOLLING: "1"
      VOXCPM_TTS_BASE_URL: "${VOXCPM_TTS_BASE_URL:-}"
      VOXCPM_TTS_ENDPOINT: "${VOXCPM_TTS_ENDPOINT:-}"
      VOXCPM_TTS_CLONE_MODE: "${VOXCPM_TTS_CLONE_MODE:-clone_with_prompt}"
      VOXCPM_TTS_CLONE_ENDPOINT: "${VOXCPM_TTS_CLONE_ENDPOINT:-}"
      VOXCPM_TTS_CONTROLLABLE_CLONE_ENDPOINT: "${VOXCPM_TTS_CONTROLLABLE_CLONE_ENDPOINT:-}"
      VOXCPM_TTS_HIGH_FIDELITY_CLONE_ENDPOINT: "${VOXCPM_TTS_HIGH_FIDELITY_CLONE_ENDPOINT:-}"
      VOXCPM_TTS_CONTROL: "${VOXCPM_TTS_CONTROL:-}"
      VOXCPM_TTS_CFG_VALUE: "${VOXCPM_TTS_CFG_VALUE:-2}"
      VOXCPM_TTS_INFERENCE_TIMESTEPS: "${VOXCPM_TTS_INFERENCE_TIMESTEPS:-10}"
      VOXCPM_TTS_NORMALIZE: "${VOXCPM_TTS_NORMALIZE:-true}"
      VOXCPM_TTS_DENOISE: "${VOXCPM_TTS_DENOISE:-false}"
      VOXCPM_TTS_RETRY_BADCASE: "${VOXCPM_TTS_RETRY_BADCASE:-true}"
      VOXCPM_TTS_SAVE: "${VOXCPM_TTS_SAVE:-false}"
      VOXCPM_TTS_FILENAME_PREFIX: "${VOXCPM_TTS_FILENAME_PREFIX:-ai-video-studio}"
      VOXCPM_TTS_TIMEOUT_MS: "${VOXCPM_TTS_TIMEOUT_MS:-180000}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/workspace
      - ai-video-studio-node-modules:/workspace/node_modules
      - ./out:/workspace/out
    ports:
      - "${STUDIO_PORT:-3001}:3000"
    command: >-
      bash -lc "mkdir -p /tmp/ai-video-studio-home /tmp/npm-cache /workspace/out &&
      [ -d /workspace/node_modules/remotion ] || npm install &&
      npm run remotion:ensure-browser &&
      npm run studio -- --host 0.0.0.0 --port 3000"

volumes:
  ai-video-studio-node-modules:
