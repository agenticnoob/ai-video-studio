<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Producer Reusable Asset Library</title>
<style>
:root{color-scheme:dark;background:#07111f;color:#e5eefb;font-family:Inter,ui-sans-serif,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0}header{padding:28px 32px 18px;border-bottom:1px solid #24344a;background:#0b1728}h1{margin:0 0 8px;font-size:28px}.sub{color:#91a4bd}.controls{display:grid;grid-template-columns:minmax(240px,2fr) repeat(6,minmax(120px,1fr));gap:10px;padding:16px 32px;position:sticky;top:0;background:#07111fee;backdrop-filter:blur(10px);z-index:2}input,select{width:100%;border:1px solid #30445f;border-radius:9px;background:#0e1d30;color:#e5eefb;padding:10px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;padding:20px 32px}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}.card{border:1px solid #263b55;border-radius:13px;background:#0d1a2b;padding:12px;cursor:pointer;text-align:left;color:inherit}.card:hover{border-color:#5aa7d8}.preview{display:flex;height:150px;align-items:center;justify-content:center;border-radius:9px;background:repeating-conic-gradient(#122238 0 25%,#0d1a2b 0 50%) 50%/16px 16px;overflow:hidden}.preview img{width:100%;height:100%;object-fit:contain}.title{font-weight:700;margin-top:10px}.meta,.tags{font-size:12px;color:#93a9c3;margin-top:5px}.tag{display:inline-block;padding:2px 6px;margin:2px;border-radius:999px;background:#18314d}.deprecated{opacity:.58}.details{position:sticky;top:86px;align-self:start;border:1px solid #263b55;border-radius:13px;background:#0d1a2b;padding:18px;min-height:220px;overflow-wrap:anywhere}.details h2{margin-top:0}.details dt{color:#85c8ef;margin-top:12px}.details dd{margin:4px 0}.empty{padding:64px;border:1px dashed #30445f;border-radius:13px;text-align:center;color:#91a4bd}@media(max-width:1100px){.controls{grid-template-columns:1fr 1fr}.layout{grid-template-columns:1fr}.details{position:static}}@media(max-width:640px){.controls,.layout{padding-left:14px;padding-right:14px}.controls{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Producer Reusable Asset Library</h1><div class="sub">Read-only catalog. Agent-managed source records remain authoritative.</div></header>
<section class="controls"><input id="asset-search" type="search" placeholder="Search title, subjects, uses, roles, style…">
<select id="filter-kind"><option value="">All types</option></select><select id="filter-tag"><option value="">All tags</option></select>
<select id="filter-style"><option value="">All styles</option></select><select id="filter-role"><option value="">All roles</option></select>
<select id="filter-aspect"><option value="">All ratios</option></select><select id="filter-status"><option value="active">Active</option><option value="deprecated">Deprecated</option><option value="">All statuses</option></select></section>
<main class="layout"><section><div id="asset-cards" class="cards"></div><div id="empty-state" class="empty" hidden>No reusable assets yet</div></section><aside id="asset-details" class="details"><h2>Asset details</h2><p class="sub">Select a card to inspect semantics, provenance, integrity, and usage.</p></aside></main>
<script>const catalog={"version":1,"items":[],"facets":{"kinds":[],"tags":[],"styleProfileIds":[],"roles":[],"aspectRatioGroups":[],"statuses":[]}};const byId=(id)=>document.getElementById(id);const controls={text:byId('asset-search'),kind:byId('filter-kind'),tag:byId('filter-tag'),style:byId('filter-style'),role:byId('filter-role'),aspect:byId('filter-aspect'),status:byId('filter-status')};
const addOptions=(el,values)=>values.forEach(value=>{const option=document.createElement('option');option.value=value;option.textContent=value;el.append(option)});addOptions(controls.kind,catalog.facets.kinds);addOptions(controls.tag,catalog.facets.tags);addOptions(controls.style,catalog.facets.styleProfileIds);addOptions(controls.role,catalog.facets.roles);addOptions(controls.aspect,catalog.facets.aspectRatioGroups);
const searchable=(item)=>[item.id,item.title,item.description,...item.semantics.subjects,...item.semantics.keywords,...item.semantics.roles,...item.semantics.recommendedUses,...item.semantics.avoidUses,...item.semantics.styleProfileIds,...item.semantics.styleTags].join(' ').toLocaleLowerCase();
const addRow=(dl,label,value)=>{const dt=document.createElement('dt');dt.textContent=label;const dd=document.createElement('dd');dd.textContent=Array.isArray(value)?value.join(', '):String(value??'—');dl.append(dt,dd)};
const showDetails=(item)=>{const panel=byId('asset-details');panel.replaceChildren();const title=document.createElement('h2');title.textContent=item.title;const description=document.createElement('p');description.textContent=item.description;const dl=document.createElement('dl');addRow(dl,'Recommended uses',item.semantics.recommendedUses);addRow(dl,'Avoid uses',item.semantics.avoidUses);addRow(dl,'Subjects',item.semantics.subjects);addRow(dl,'Roles',item.semantics.roles);addRow(dl,'Styles',[...item.semantics.styleProfileIds,...item.semantics.styleTags]);addRow(dl,'Dimensions',item.visual.width+' × '+item.visual.height);addRow(dl,'Colors',item.visual.dominantColors);addRow(dl,'Transparent',item.visual.transparentBackground);addRow(dl,'Source',item.source.provider);addRow(dl,'Creator',item.source.creator);addRow(dl,'License',item.source.license);addRow(dl,'SHA-256',item.integrity.sha256);addRow(dl,'Usage',item.usages.map(u=>u.compositionId+': '+u.purpose));panel.append(title,description,dl)};
const render=()=>{const words=controls.text.value.trim().toLocaleLowerCase().split(/ +/).filter(Boolean);const items=catalog.items.filter(item=>(!controls.status.value||item.lifecycle.status===controls.status.value)&&(!controls.kind.value||item.kind===controls.kind.value)&&(!controls.tag.value||item.semantics.styleTags.includes(controls.tag.value))&&(!controls.style.value||item.semantics.styleProfileIds.includes(controls.style.value))&&(!controls.role.value||item.semantics.roles.includes(controls.role.value))&&(!controls.aspect.value||item.aspectRatioGroup===controls.aspect.value)&&words.every(word=>searchable(item).includes(word)));const cards=byId('asset-cards');cards.replaceChildren();byId('empty-state').hidden=items.length!==0;items.forEach(item=>{const card=document.createElement('button');card.type='button';card.className='card '+(item.lifecycle.status==='deprecated'?'deprecated':'');card.addEventListener('click',()=>showDetails(item));const preview=document.createElement('div');preview.className='preview';const image=document.createElement('img');image.src=item.mediaUrl;image.alt=item.title;preview.append(image);const title=document.createElement('div');title.className='title';title.textContent=item.title;const meta=document.createElement('div');meta.className='meta';meta.textContent=item.kind+' · '+item.visual.width+'×'+item.visual.height+' · '+item.lifecycle.status;const tags=document.createElement('div');tags.className='tags';item.semantics.styleTags.forEach(value=>{const tag=document.createElement('span');tag.className='tag';tag.textContent=value;tags.append(tag)});card.append(preview,title,meta,tags);cards.append(card)});};Object.values(controls).forEach(control=>control.addEventListener('input',render));render();
</script></body></html>
